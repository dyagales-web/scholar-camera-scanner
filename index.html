<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Scholar Attendance</title>

  <!-- QR DECODER -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f4f7fb;
      font-family: Arial, Helvetica, sans-serif;
      color: #111827;
    }

    body {
      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    .header {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px 18px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      margin-bottom: 16px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 17px;
      color: #6b7280;
    }

    .camera-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    .camera-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #080c16;
      border-radius: 16px;
      overflow: hidden;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #canvas {
      display: none;
    }

    /*
      QR GUIDE
    */

    .scan-frame {
      position: absolute;
      width: 72%;
      aspect-ratio: 1 / 1;
      left: 14%;
      top: 18%;

      border: 3px solid #ffffff;
      border-radius: 18px;

      pointer-events: none;

      box-shadow:
        0 0 0 9999px rgba(0,0,0,.28);
    }

    .corner {
      position: absolute;
      width: 32px;
      height: 32px;
      border-color: #ffffff;
      border-style: solid;
    }

    .corner.tl {
      left: -3px;
      top: -3px;
      border-width: 5px 0 0 5px;
      border-radius: 10px 0 0 0;
    }

    .corner.tr {
      right: -3px;
      top: -3px;
      border-width: 5px 5px 0 0;
      border-radius: 0 10px 0 0;
    }

    .corner.bl {
      left: -3px;
      bottom: -3px;
      border-width: 0 0 5px 5px;
      border-radius: 0 0 0 10px;
    }

    .corner.br {
      right: -3px;
      bottom: -3px;
      border-width: 0 5px 5px 0;
      border-radius: 0 0 10px 0;
    }

    .scan-line {
      position: absolute;
      left: 4%;
      width: 92%;
      height: 2px;
      background: #ffffff;
      box-shadow: 0 0 6px rgba(255,255,255,.8);
      animation: scanLine 1.8s linear infinite;
    }

    @keyframes scanLine {

      0% {
        top: 5%;
      }

      50% {
        top: 95%;
      }

      100% {
        top: 5%;
      }

    }

    .status {
      text-align: center;
      padding: 15px 5px 10px;
      color: #6b7280;
      font-size: 15px;
      line-height: 1.4;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 16px;
      margin-top: 8px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    #startButton {
      background: #111827;
      color: white;
    }

    #stopButton {
      background: #e5e7eb;
      color: #374151;
    }

    .result {
      margin-top: 15px;
      border-radius: 15px;
      padding: 18px;
      text-align: center;
      font-weight: 700;
    }

    .success {
      background: #ecfdf5;
      border: 2px solid #10b981;
      color: #065f46;
    }

    .duplicate {
      background: #fffbeb;
      border: 2px solid #f59e0b;
      color: #92400e;
    }

    .invalid {
      background: #fef2f2;
      border: 2px solid #ef4444;
      color: #991b1b;
    }

    .processing {
      background: #eff6ff;
      border: 2px solid #3b82f6;
      color: #1e40af;
    }

    .error {
      background: #fef2f2;
      border: 2px solid #ef4444;
      color: #991b1b;
    }

    .icon {
      font-size: 34px;
      margin-bottom: 6px;
    }

    .result-title {
      font-size: 20px;
      font-weight: 800;
    }

    .result-name {
      font-size: 19px;
      margin-top: 7px;
    }

    .details {
      font-size: 14px;
      margin-top: 8px;
      line-height: 1.6;
    }

  </style>

</head>


<body>

<div class="container">

  <div class="header">

    <h1>📋 Scholar Attendance</h1>

    <p>📷 Phone Camera QR Scanner</p>

  </div>


  <div class="camera-card">

    <div class="camera-wrapper">

      <video
        id="video"
        autoplay
        muted
        playsinline>
      </video>

      <canvas id="canvas"></canvas>


      <div class="scan-frame">

        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <div class="scan-line"></div>

      </div>

    </div>


    <div
      id="cameraStatus"
      class="status">

      Tap START CAMERA to begin.

    </div>


    <button
      id="startButton"
      onclick="startCamera()">

      ▶ START CAMERA

    </button>


    <button
      id="stopButton"
      onclick="stopCamera()">

      ■ STOP CAMERA

    </button>


    <div id="result"></div>

  </div>

</div>


<script>


/* ============================================================
   APPS SCRIPT URL
   ============================================================ */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyi6Cs53LZ-HajMXYFdF4R-bWAR2yfXV5vbhd9PgTm-dTGCMYSrp5dkDFNHyH-WHz9T/exec";


/* ============================================================
   VARIABLES
   ============================================================ */

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const context =
  canvas.getContext(
    "2d",
    {
      willReadFrequently: true
    }
  );


let stream = null;

let scanning = false;

let processing = false;

let animationFrame = null;

let lastScannedCode = "";

let lastScannedTime = 0;


/* ============================================================
   START CAMERA
   ============================================================ */

async function startCamera() {

  if (scanning) {
    return;
  }

  clearResult();

  setStatus(
    "Requesting camera permission..."
  );


  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Camera access is not supported by this browser."
      );

    }


    /*
      IMPORTANT:
      Ask specifically for the rear camera.
    */

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            exact: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false

      });


    video.srcObject = stream;


    await video.play();


    scanning = true;


    setStatus(
      "Camera active. Place the QR code inside the box."
    );


    scanLoop();

  }


  catch (error) {

    console.error(
      "Camera error:",
      error
    );


    /*
      Some phones may reject exact environment.
      Try again with ideal environment.
    */

    if (
      error.name === "OverconstrainedError"
    ) {

      try {

        stream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: {
                ideal: "environment"
              }
            },

            audio: false

          });


        video.srcObject =
          stream;

        await video.play();

        scanning = true;

        setStatus(
          "Camera active. Place the QR code inside the box."
        );

        scanLoop();

        return;

      }

      catch (secondError) {

        console.error(
          secondError
        );

      }

    }


    if (
      error.name === "NotAllowedError"
    ) {

      setStatus(
        "Camera permission was denied."
      );

    }

    else {

      setStatus(
        "Camera error: " +
        error.message
      );

    }

  }

}


/* ============================================================
   STOP CAMERA
   ============================================================ */

function stopCamera() {

  scanning = false;


  if (animationFrame) {

    cancelAnimationFrame(
      animationFrame
    );

    animationFrame = null;

  }


  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {
          track.stop();
        }
      );

    stream = null;

  }


  video.srcObject = null;


  setStatus(
    "Camera stopped."
  );

}


/* ============================================================
   MAIN SCAN LOOP
   ============================================================ */

function scanLoop() {

  if (!scanning) {
    return;
  }


  if (
    video.readyState >= 2 &&
    video.videoWidth > 0 &&
    video.videoHeight > 0
  ) {

    /*
      We scan the central portion first.
      This matches the white QR guide.
    */

    const videoWidth =
      video.videoWidth;

    const videoHeight =
      video.videoHeight;


    const cropSize =
      Math.min(
        videoWidth,
        videoHeight
      ) * 0.78;


    const cropX =
      (videoWidth - cropSize) / 2;


    const cropY =
      (videoHeight - cropSize) / 2;


    /*
      Use a sufficiently large canvas.
    */

    const size =
      Math.min(
        1000,
        Math.max(
          700,
          Math.floor(cropSize)
        )
      );


    canvas.width = size;
    canvas.height = size;


    context.drawImage(

      video,

      cropX,
      cropY,
      cropSize,
      cropSize,

      0,
      0,
      size,
      size

    );


    const imageData =
      context.getImageData(
        0,
        0,
        size,
        size
      );


    /*
      jsQR
    */

    if (
      typeof jsQR === "function"
    ) {

      const code =
        jsQR(

          imageData.data,

          imageData.width,

          imageData.height,

          {
            inversionAttempts:
              "attemptBoth"
          }

        );


      if (
        code &&
        code.data
      ) {

        handleDetectedQR(
          code.data
        );

      }

    }

  }


  /*
    Scan continuously.
  */

  animationFrame =
    requestAnimationFrame(
      scanLoop
    );

}


/* ============================================================
   QR DETECTED
   ============================================================ */

function handleDetectedQR(
  data
) {

  if (processing) {
    return;
  }


  const scholarId =
    String(data || "")
      .trim();


  if (!scholarId) {
    return;
  }


  const now =
    Date.now();


  /*
    Prevent repeated detection.
  */

  if (
    scholarId === lastScannedCode &&
    now - lastScannedTime < 3000
  ) {

    return;

  }


  lastScannedCode =
    scholarId;

  lastScannedTime =
    now;


  console.log(
    "QR DETECTED:",
    scholarId
  );


  processScholar(
    scholarId
  );

}


/* ============================================================
   SEND TO APPS SCRIPT
   ============================================================ */

function processScholar(
  scholarId
) {

  if (processing) {
    return;
  }


  processing = true;


  setResult(
    "processing",
    "⏳",
    "Reading Scholar QR...",
    scholarId
  );


  /*
    Send using hidden form.
  */

  const form =
    document.createElement(
      "form"
    );


  form.method =
    "POST";


  form.action =
    APPS_SCRIPT_URL;


  form.target =
    "attendanceFrame";


  form.style.display =
    "none";


  const input =
    document.createElement(
      "input"
    );


  input.type =
    "hidden";


  input.name =
    "scholarId";


  input.value =
    scholarId;


  form.appendChild(
    input
  );


  document.body.appendChild(
    form
  );


  form.submit();


  /*
    Show immediate detection.
  */

  setTimeout(
    function() {

      processing = false;


      setResult(
        "success",
        "✓",
        "QR Code Detected",
        scholarId
      );


      /*
        Prepare for next student.
      */

      setTimeout(
        function() {

          clearResult();

        },
        1200
      );

    },
    700
  );


  setTimeout(
    function() {

      form.remove();

    },
    3000
  );

}


/* ============================================================
   STATUS
   ============================================================ */

function setStatus(
  message
) {

  document
    .getElementById(
      "cameraStatus"
    )
    .textContent =
    message;

}


/* ============================================================
   RESULT
   ============================================================ */

function setResult(
  type,
  icon,
  title,
  scholarId
) {

  const result =
    document.getElementById(
      "result"
    );


  result.className =
    "result " + type;


  result.innerHTML =

    "<div class='icon'>" +
    icon +
    "</div>" +

    "<div class='result-title'>" +
    escapeHtml(title) +
    "</div>" +

    (
      scholarId
      ?

      "<div class='details'>" +
      "<strong>Scholar ID:</strong><br>" +
      escapeHtml(scholarId) +
      "</div>"

      :

      ""
    );

}


/* ============================================================
   CLEAR RESULT
   ============================================================ */

function clearResult() {

  const result =
    document.getElementById(
      "result"
    );


  result.className =
    "";


  result.innerHTML =
    "";

}


/* ============================================================
   ESCAPE HTML
   ============================================================ */

function escapeHtml(
  value
) {

  return String(
    value || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>


<iframe
  name="attendanceFrame"
  style="display:none;">
</iframe>


</body>

</html>
